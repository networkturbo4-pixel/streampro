<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Accent Hexagon / Squircle Core -->
  <g filter="url(#shadow)">
    <rect width="280" height="280" x="116" y="116" rx="64" fill="url(#accentGrad)"/>
  </g>

  <!-- Inner Dynamic Ring Stream Lines -->
  <path d="M 170 126 C 240 100, 310 106, 360 145" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 390 190 C 415 250, 400 320, 350 368" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-linecap="round"/>

  <!-- Centered Play Polygon (Stream Icon) -->
  <polygon points="216,192 344,256 216,320" fill="url(#symbolGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linejoin="round"/>

  <!-- PRO Dot Badge -->
  <circle cx="344" cy="180" r="14" fill="#38bdf8"/>
</svg>
